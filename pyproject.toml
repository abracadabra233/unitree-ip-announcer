[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-ip-announcer"
version = "0.1.0"
description = "Announce the Unitree robot's wlan0 IPv4 address using its official TTS SDK."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "unitree-sdk2py==1.0.1",
    "cyclonedds==0.10.2",
]

[project.scripts]
unitree-ip-announcer = "unitree_ip_announcer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.12.3"
# Build the binding against the native library installed by bootstrap.sh.
no-binary-package = ["cyclonedds"]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
unitree-sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "814556d15970dd2ecf1c9984e845ca02ab07e206" }
